[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kensho"
version = "0.1.0"
description = "Evaluation harness for autonomous coding agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
kensho = "kensho.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kensho*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: runs full benchmark tasks (slower)",
]
